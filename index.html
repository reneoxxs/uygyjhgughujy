function trText(text){
 const source=String(text??'');
 if(currentLang==='es') return source;
 const exact=EXACT_TRANSLATIONS[currentLang]||{};
 if(Object.prototype.hasOwnProperty.call(exact,source)) return exact[source];
 // Fallback is reserved for newly added small UI labels; all existing catalogue names and descriptions are exact-mapped.
 const dict=WORDS[currentLang]||{}; let translated=source;
 Object.keys(dict).sort((a,b)=>b.length-a.length).forEach(k=>{translated=translated.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),dict[k]);});
 return translated;
}
function trCategory(text){return (CATEGORY_TRANSLATIONS[currentLang]||{})[text]||trText(text);}

      sh.id='cat-bocadillos';sh.classList.add('nav-anchor');
      const subLink=document.createElement('a');subLink.href='#cat-bocadillos';subLink.textContent=trCategory('BOCADILLOS').replace(/^\s*[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]+\s*/u,'').trim();subLink.dataset.target='cat-bocadillos';
      subLink.addEventListener('click',()=>{navEl.querySelectorAll('a').forEach(a=>{a.classList.remove('active');a.removeAttribute('aria-current')});subLink.classList.add('active');subLink.setAttribute('aria-current','location')});
      navEl.appendChild(subLink);
    }
    section.appendChild(sh);return;
   }
   hasProducts=true;
   const card=document.createElement('article');card.className='card';
   // Si no hay una foto real y correspondiente, no se muestra ningún hueco ni icono de sustitución.
   if(it.image){
    const photo=document.createElement('div');photo.className='photo';
    const img=document.createElement('img');img.loading='lazy';img.src=it.image;img.alt=trText(it.name);img.decoding='async';
    img.onerror=()=>{if(it.fallbackImage && !img.dataset.fallbackTried){img.dataset.fallbackTried='1';img.src=it.fallbackImage;}else{photo.remove();}};
    photo.appendChild(img);card.appendChild(photo);
   }
   const body=document.createElement('div');body.className='card-body';
   const title=document.createElement('h3');title.className='product-title';title.textContent=trText(it.name)+(it.comboEmojis||'');body.appendChild(title);
   if(it.details){const d=document.createElement('p');d.className='details';d.textContent=trText(it.details);body.appendChild(d);}
   const price=document.createElement('div');if(it.price){price.className='price';price.textContent=it.price;}else if(sec.slug==='pizza'){price.className='sizes';price.textContent=LANGS[currentLang].available;}else{price.className='empty-price';price.textContent=LANGS[currentLang].noPrice;}body.appendChild(price);
   
   card.appendChild(body);grid.appendChild(card);
  });
  if(grid.children.length)section.appendChild(grid);
  if(section.children.length>1)menuEl.appendChild(section);
 });
}
filterEl.addEventListener('input',e=>render(e.target.value));
function activateMotion(){
 const cards=[...document.querySelectorAll('.card')];
 cards.forEach((card,i)=>{card.classList.add('reveal');card.style.setProperty('--delay',Math.min(i%8,7)*45+'ms');});
 if(!('IntersectionObserver' in window)){cards.forEach(c=>c.classList.add('is-visible'));return;}
 const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}}),{threshold:.08,rootMargin:'0px 0px -25px 0px'});
 cards.forEach(card=>observer.observe(card));
}
let sectionObserver=null;
let scrollSpyHandler=null;
let scrollSpyActive='';
function observeActiveSection(){
 if(sectionObserver){sectionObserver.disconnect();sectionObserver=null;}
 if(scrollSpyHandler){window.removeEventListener('scroll',scrollSpyHandler);window.removeEventListener('resize',scrollSpyHandler);scrollSpyHandler=null;}
 const links=[...navEl.querySelectorAll('a[data-target]')];
 const targets=links.map(link=>({link,el:document.getElementById(link.dataset.target)})).filter(x=>x.el);
 if(!targets.length)return;
 let queued=false;
 const setActive=(target)=>{
  const id=target.link.dataset.target;
  links.forEach(a=>{const active=a===target.link;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});
  if(id!==scrollSpyActive){
   scrollSpyActive=id;
   if(window.matchMedia('(max-width: 1000px)').matches){
    const nr=navEl.getBoundingClientRect(), lr=target.link.getBoundingClientRect();
    if(lr.left<nr.left+8 || lr.right>nr.right-8){
     const delta=(lr.left+lr.width/2)-(nr.left+nr.width/2);
     navEl.scrollTo({left:Math.max(0,navEl.scrollLeft+delta),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    }
   }
  }
 };
 const update=()=>{
  queued=false;
  // Pick the last target above a stable reading line. This avoids competing observer
  // callbacks when a subheading (such as BOCADILLOS) sits inside a larger category.
  const mobile=window.matchMedia('(max-width: 1000px)').matches;
  const nr=navEl.getBoundingClientRect();
  const marker=(mobile && nr.top<=16 && nr.bottom<window.innerHeight) ? nr.bottom+22 : Math.max(110,window.innerHeight*.28);
  let current=targets[0];
  for(const t of targets){
   if(t.el.getBoundingClientRect().top<=marker)current=t;
   else break;
  }
  setActive(current);
 };
 scrollSpyHandler=()=>{
  if(queued)return;
  queued=true;
  window.requestAnimationFrame(update);
 };
 window.addEventListener('scroll',scrollSpyHandler,{passive:true});
 window.addEventListener('resize',scrollSpyHandler,{passive:true});
 update();
}
const originalRender=render;
render=function(query=''){originalRender(query);activateMotion();observeActiveSection();};
buildLanguageControl();applyLanguage();render();
</script></body></html>
